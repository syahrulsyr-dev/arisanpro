name: Temp Login Mobile UI Check
on:
  push:
    branches:
      - fix/login-mobile-brand-panel-r2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect login at mobile and desktop
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aw-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          cat > login-check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out=[];
            for(const v of [{name:'390',width:390,height:844},{name:'430',width:430,height:932},{name:'1440',width:1440,height:1000}]){
              const page=await browser.newPage({viewport:{width:v.width,height:v.height}});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(2500);
              const r=await page.evaluate(()=>{
                const shell=document.querySelector('#root .aw-login-shell');
                const card=document.querySelector('#root .aw-login-card');
                const brand=document.querySelector('#root .aw-login-brand');
                const form=document.querySelector('#root .aw-login-form');
                const email=document.querySelector('#email');
                const password=document.querySelector('#password');
                const button=Array.from(document.querySelectorAll('#root button')).find(b=>(b.textContent||'').includes('Masuk Dashboard'));
                const rect=x=>x?x.getBoundingClientRect():null;
                const rb=rect(brand), rf=rect(form), rc=rect(card);
                return {
                  shellVisible:!!shell && !!(shell.offsetWidth||shell.offsetHeight),
                  cardVisible:!!card && !!(card.offsetWidth||card.offsetHeight),
                  brandVisible:!!brand && !!(brand.offsetWidth||brand.offsetHeight),
                  formVisible:!!form && !!(form.offsetWidth||form.offsetHeight),
                  emailVisible:!!email && !!(email.offsetWidth||email.offsetHeight),
                  passwordVisible:!!password && !!(password.offsetWidth||password.offsetHeight),
                  loginButtonVisible:!!button && !!(button.offsetWidth||button.offsetHeight),
                  brandHeight:rb?Math.round(rb.height):0,
                  formHeight:rf?Math.round(rf.height):0,
                  cardHeight:rc?Math.round(rc.height):0,
                  viewportHeight:innerHeight,
                  viewportWidth:innerWidth,
                  brandShare:rb?Number((rb.height/innerHeight).toFixed(3)):1,
                  bodyOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
                  brandFeatureText:Array.from(brand?.querySelectorAll('.mt-8')||[]).map(x=>x.textContent.trim()).filter(Boolean).join(' | '),
                  brandFeatureDisplay:brand?.querySelector('.mt-8') ? getComputedStyle(brand.querySelector('.mt-8')).display : 'none'
                };
              });
              console.log(v.name,JSON.stringify(r));
              if(!r.shellVisible||!r.cardVisible||!r.formVisible||!r.emailVisible||!r.passwordVisible||!r.loginButtonVisible) throw new Error('Login UI incomplete at '+v.name+'px');
              if(v.width<=430 && (r.brandHeight>220 || r.brandShare>0.27)) throw new Error('Mobile green brand panel still too tall at '+v.name+'px: '+r.brandHeight+'px');
              if(v.width<=430 && r.brandFeatureText && r.brandFeatureDisplay !== 'none') throw new Error('Mobile feature list is visibly rendered');
              if(v.width>=1000 && r.brandHeight<300) throw new Error('Desktop brand panel unexpectedly collapsed: '+r.brandHeight+'px');
              if(r.bodyOverflow) throw new Error('Login horizontal overflow at '+v.name+'px');
              if(v.width<=430) await page.screenshot({path:'test-results/login-'+v.name+'.png',fullPage:true});
              out.push({viewport:v.name,...r});
            }
            fs.writeFileSync('test-results/login-summary.json',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node login-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-login-mobile-ui
          path: test-results/
          retention-days: 3
