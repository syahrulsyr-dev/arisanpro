name: Public Link R2 Smoke

on:
  push:
    branches:
      - fix/public-link-loading-r2

permissions:
  contents: read

jobs:
  public-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify public route
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/arisanpro-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          cat > public-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const res=await page.goto('http://127.0.0.1:4173/?view=public',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(8000);
            const out=await page.evaluate(()=>({
              url:location.href,
              publicSnapshot:!!window.__AW_PUBLIC_FINANCE_SNAPSHOT__,
              publicError:window.__AW_PUBLIC_FINANCE_ERROR__||null,
              finance:!!document.querySelector('#aw-public-finance'),
              loading:/Memuat data warga/i.test(document.body?.innerText||''),
              failed:/Gagal memuat data warga/i.test(document.body?.innerText||''),
              counts:window.__AW_PUBLIC_FINANCE_SNAPSHOT__?{
                members:window.__AW_PUBLIC_FINANCE_SNAPSHOT__.members?.length||0,
                periods:window.__AW_PUBLIC_FINANCE_SNAPSHOT__.periods?.length||0,
                iuran:window.__AW_PUBLIC_FINANCE_SNAPSHOT__.iuran?.length||0,
                winners:window.__AW_PUBLIC_FINANCE_SNAPSHOT__.winners?.length||0
              }:null
            }));
            console.log(JSON.stringify({out,errors},null,2));
            if(!res?.ok())throw new Error('HTTP public route '+(res?.status()||'unknown'));
            if(!out.finance)throw new Error('Canonical public finance section tidak render: '+JSON.stringify(out));
            if(out.loading||out.failed)throw new Error('Public route masih berada di loading/error state: '+JSON.stringify(out));
            if(out.publicError)throw new Error('Public loader error: '+JSON.stringify(out.publicError));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node public-smoke.cjs
