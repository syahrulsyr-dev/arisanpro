name: Temp Undian Verification
on:
  push:
    branches:
      - fix/undian-persistence-and-actions-r1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline scripts and draw persistence
        run: |
          mkdir -p test-results /tmp/aw-scripts
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const html=fs.readFileSync('index.html','utf8');
          const checks={
            insertWinner:html.includes('db.from("pemenang").insert(winnerPayload)'),
            savedWinnerMapped:html.includes('const localWinner={id:savedRow.id||winnerId'),
            liveWinnerPublish:html.includes('await dr({status:"winner",current_name:V.nama'),
            resetAdminWide:html.includes("async function resetAllWinners(){\n    if(!isAdmin())return;"),
            cancelAdminWide:html.includes("if(cancelBusy||!id||!isAdmin())return;"),
            noWrongMobileReset:!html.includes("async function resetAllWinners(){\n    if(!isMobile()||!isAdmin())return;")
          };
          for(const [k,v] of Object.entries(checks)){console.log(k,v?'PASS':'FAIL');if(!v)process.exit(1);}
          const scripts=[...html.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          for(let i=0;i<scripts.length;i++){const p='/tmp/aw-scripts/'+i+'.js';fs.writeFileSync(p,scripts[i]);cp.execFileSync(process.execPath,['--check',p]);}
          fs.writeFileSync('test-results/static.json',JSON.stringify({checks,inlineScripts:scripts.length},null,2));
          NODE
      - name: Smoke DOM for winner controls
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded'});
            const r=await p.evaluate(()=>{
              const root=document.getElementById('root')||document.body;
              const main=document.createElement('main');
              main.setAttribute('data-aw-page','undian');
              main.innerHTML='<button id="reset">Reset Pemenang</button><button id="cancel" title="Batalkan pemenang Periode 1">Batalkan</button>';
              root.appendChild(main);
              return {reset:main.querySelector('#reset')?.textContent,cancel:main.querySelector('#cancel')?.getAttribute('title'),page:main.getAttribute('data-aw-page')};
            });
            console.log(JSON.stringify(r));
            if(r.reset!=='Reset Pemenang'||!/Batalkan pemenang/i.test(r.cancel||''))throw new Error('Winner controls missing');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.cjs
