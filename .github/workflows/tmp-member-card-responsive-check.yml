name: tmp-member-card-responsive-check

on:
  push:
    branches:
      - fix/member-card-responsive-r2
  pull_request:
    branches:
      - main

jobs:
  member-card-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Responsive member card assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');

          const src=fs.readFileSync('index.html','utf8');
          const styles=[...src.matchAll(/<style(?:\s[^>]*)?>([\\s\\S]*?)<\\/style>/gi)].map(m=>m[1]).join('\n');
          if(!styles.includes('aw-v121-member-cards-r2')) throw new Error('R2 member-card CSS tidak ditemukan');

          const mock=`
          <main id="root">
            <main data-aw-page="anggota">
              <div>
                <div class="space-y-4">
                  <section class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
                    <div class="bg-white rounded-[20px] border border-slate-200 p-5 shadow-sm">
                      <div class="flex items-start justify-between">
                        <div class="flex gap-3">
                          <div class="w-12 h-12 rounded-2xl">BS</div>
                          <div>
                            <div class="font-bold text-sm flex items-center gap-2">Budi Santoso</div>
                            <div class="text-xs text-slate-500">081234567890</div>
                            <div class="text-xs text-slate-500">Jl. Merdeka, Blok A • RT 01</div>
                          </div>
                        </div>
                        <div class="flex gap-1"><button></button><button></button></div>
                      </div>
                      <div class="mt-4 grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 rounded-xl p-2.5 text-center"><div class="text-[10px]">Lunas</div><div class="font-bold text-sm">12/12</div></div>
                        <div class="bg-slate-50 rounded-xl p-2.5 text-center"><div class="text-[10px]">Bergabung</div><div class="font-bold text-xs">01/01/2026</div></div>
                        <div class="bg-slate-50 rounded-xl p-2.5 text-center"><div class="text-[10px]">Status</div><div class="font-bold text-xs">Belum Menang</div></div>
                      </div>
                    </div>
                    <div class="bg-white rounded-[20px] border border-slate-200 p-5 shadow-sm"><div>Anggota 2</div><div class="grid grid-cols-3"><div>A</div><div>B</div><div>C</div></div></div>
                    <div class="bg-white rounded-[20px] border border-slate-200 p-5 shadow-sm"><div>Anggota 3</div><div class="grid grid-cols-3"><div>A</div><div>B</div><div>C</div></div></div>
                    <div class="bg-white rounded-[20px] border border-slate-200 p-5 shadow-sm"><div>Anggota 4</div><div class="grid grid-cols-3"><div>A</div><div>B</div><div>C</div></div></div>
                  </section>
                </div>
              </div>
            </main>
          </main>`;

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [360,390,430,1440,1600]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.setContent(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${styles}</style></head><body class="aw-authenticated"><div id="app">${mock}</div></body></html>`);
              const result=await page.evaluate(()=>{
                const grid=document.querySelector('main[data-aw-page="anggota"] [class~="md:grid-cols-2"][class~="xl:grid-cols-3"]');
                const cards=[...grid.children];
                const cs=getComputedStyle(grid);
                const bodyOverflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
                return {
                  cols:cs.gridTemplateColumns.split(' ').filter(Boolean).length,
                  gap:cs.gap,
                  width:grid.getBoundingClientRect().width,
                  cardWidths:cards.map(x=>x.getBoundingClientRect().width),
                  cardHeights:cards.map(x=>x.getBoundingClientRect().height),
                  overflow:bodyOverflow,
                  nameSize:getComputedStyle(cards[0].querySelector('.font-bold.text-sm')).fontSize,
                  statSize:getComputedStyle(cards[0].querySelector('.font-bold.text-xs')).fontSize
                };
              });
              console.log(width,result);
              const expectedCols=width<375?1:(width<1280?2:(width<1600?3:4));
              if(result.cols!==expectedCols) throw new Error(`cols @ ${width}: got ${result.cols}, expected ${expectedCols}`);
              if(result.overflow>0) throw new Error(`horizontal overflow @ ${width}: ${result.overflow}px`);
              if(result.cardWidths.some(w=>w<120)) throw new Error(`card terlalu sempit @ ${width}: ${result.cardWidths}`);
              if(result.cardHeights.some(h=>h<140)) throw new Error(`card terlalu pendek @ ${width}: ${result.cardHeights}`);
            }
            await browser.close();
          })();
          NODE
