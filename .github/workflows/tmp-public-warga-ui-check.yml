name: tmp-public-warga-ui-check

on:
  push:
    branches:
      - fix/public-warga-responsive-canonical-r2
  pull_request:
    branches:
      - main

jobs:
  public-warga-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Public warga responsive assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          const src=fs.readFileSync('index.html','utf8');
          if(!src.includes('aw-v121-public-canonical-r2')) throw new Error('Public canonical R2 CSS tidak ditemukan');
          if(!src.includes('id="aw-v121-public-live-canonical"')) throw new Error('Public canonical script tidak ditemukan');
          const styles=src.split('<style').slice(1).map(x=>x.slice(x.indexOf('>')+1,x.indexOf('</style>'))).join('\n');
          const scriptStart=src.indexOf('<script id="aw-v121-public-live-canonical">');
          const scriptEnd=src.indexOf('</script>',scriptStart)+9;
          const publicScript=src.slice(scriptStart,scriptEnd);

          const shell=`
          <div class="min-h-screen">
            <div class="max-w-5xl">
              <div class="bg-white">
                <div class="bg-gradient-to-br"><div class="relative"><h1>Arisan Warga</h1></div></div>
                <div class="grid grid-cols-2 md:grid-cols-4"><div>A</div><div>B</div><div>C</div><div>D</div></div>
                <div class="p-6 grid md:grid-cols-2">
                  <section id="aw-public-finance"><div class="bg-white">Finance</div></section>
                  <section id="legacy-winners"><h3>Pemenang Terbaru & Riwayat</h3><div>legacy</div></section>
                </div>
              </div>
            </div>
            <div id="legacy-live" class="aw-v436-draw-overlay"><div>legacy draw</div></div>
            <div id="legacy-live-437" class="aw-v437-ready"><div>legacy ceremony</div></div>
            <div id="aw-public-live-draw"><div>legacy small overlay</div></div>
          </div>`;

          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [390,430,768,1024,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.setContent(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${styles}</style></head><body class="aw-public-live"><div id="root">${shell}</div></body></html>`);
              await page.evaluate(()=>{
                const makeQuery=(data)=>{const p=Promise.resolve(data);p.select=()=>p;p.order=()=>p;p.eq=()=>p;return p};
                const payload={
                  pemenang:{data:[{id:'w2',anggota_id:'m2',periode_id:'p2',tanggal_undi:'2026-10-03',nominal:200000},{id:'w1',anggota_id:'m1',periode_id:'p1',tanggal_undi:'2026-09-03',nominal:200000}]},
                  anggota:{data:[{id:'m1',nama:'Budi Santoso',rt:'01',color:'#059669'},{id:'m2',nama:'Siti Aminah',rt:'02',color:'#0f766e'}]},
                  periode:{data:[{id:'p1',nama:'Periode September 2026',bulan:9,tahun:2026},{id:'p2',nama:'Periode Oktober 2026',bulan:10,tahun:2026}]},
                  pembayaran_pemenang:{data:[{pemenang_id:'w1',nominal:200000,tanggal_bayar:'2026-09-04'}]},
                  undian_live:{data:{id:'live-1',status:'winner',current_name:'Siti Aminah',winner_id:'m2',winner_nama:'Siti Aminah',periode_id:'p2',periode_nama:'Periode Oktober 2026',updated_at:'2026-10-04T03:05:00Z'}}
                };
                window.__supaClient={
                  from:(table)=>table==='undian_live'
                    ?{select(){return {eq(){return {maybeSingle:()=>Promise.resolve(payload.undian_live)}}}}}
                    :makeQuery(payload[table]||{data:[],error:null}),
                  channel:()=>({on(){return this},subscribe(){return this}})
                };
                const el=document.createElement('script');
                el.textContent="";
              });
              await page.evaluate((code)=>{
                code=code.replace('  if(!isPublic())return;','  if(false)return;');
                const el=document.createElement('script');el.textContent=code;document.body.appendChild(el);
              }, publicScript.slice(publicScript.indexOf('>')+1,publicScript.lastIndexOf('</script>')));
              await page.waitForTimeout(800);
              const out=await page.evaluate(()=>{
                const canonical=document.querySelector('#aw-v121-public-winners-canonical');
                const legacyWinner=document.querySelector('#legacy-winners');
                const oldLive=document.querySelector('#legacy-live');
                const old437=document.querySelector('#legacy-live-437');
                const oldSmall=document.querySelector('#aw-public-live-draw');
                const root=document.querySelector('#root');
                const stats=[...document.querySelectorAll('[class*="grid-cols-2"][class*="md:grid-cols-4"]>div')];
                return {
                  canonical:!!canonical,
                  canonicalWidth:canonical?.getBoundingClientRect().width||0,
                  legacyWinnerDisplay:getComputedStyle(legacyWinner).display,
                  legacyLiveDisplay:getComputedStyle(oldLive).display,
                  legacy437Display:getComputedStyle(old437).display,
                  smallOverlayDisplay:oldSmall?getComputedStyle(oldSmall).display:'removed',
                  existsSmall:!!oldSmall,
                  rootScroll:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth,
                  canonicalOverflow:canonical?canonical.scrollWidth-canonical.clientWidth:9999,
                  liveStage:!!document.querySelector('#aw-v121-public-live-stage'),
                  liveStageWidth:document.querySelector('#aw-v121-public-live-stage .panel')?.getBoundingClientRect().width||0,
                  statsCount:stats.length,
                  statsWidths:stats.map(x=>x.getBoundingClientRect().width),
                  contentCols:getComputedStyle(root.querySelector('.p-6.grid.md\\:grid-cols-2')).gridTemplateColumns
                };
              });
              console.log(width,out);
              if(!out.canonical) throw new Error('canonical winners missing @ '+width);
              if(out.legacyWinnerDisplay!=='none') throw new Error('legacy winners visible @ '+width);
              if(out.legacyLiveDisplay!=='none') throw new Error('legacy V436 visible @ '+width);
              if(out.legacy437Display!=='none') throw new Error('legacy V437 visible @ '+width);
              if(out.smallOverlayDisplay!=='removed' || out.existsSmall) throw new Error('legacy small overlay visible/existing @ '+width);
              if(out.rootScroll>0 || out.canonicalOverflow>0) throw new Error('horizontal overflow @ '+width);
              if(out.canonicalWidth<=0) throw new Error('canonical winners width zero @ '+width);
              if(out.liveStage!==true) throw new Error('canonical live stage missing @ '+width);
              if(out.liveStageWidth<=0 || out.liveStageWidth>width-16) throw new Error('live stage too wide @ '+width+': '+out.liveStageWidth);
              if(width<768 && out.statsCount!==4) throw new Error('stats not rendered @ '+width);
              await page.locator('#aw-v121-public-live-stage button').click();
              await page.waitForTimeout(750);
              if(await page.locator('#aw-v121-public-live-stage').count()!==0) throw new Error('live stage reopened after close/polling @ '+width);
            }
            await browser.close();
          })();
          NODE
