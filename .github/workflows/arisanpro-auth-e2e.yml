name: ArisanPro Authenticated E2E

on:
  workflow_dispatch:
  push:
    branches:
      - ui-hardening/dashboard-to-finance
    paths:
      - index.html
      - .github/workflows/arisanpro-auth-e2e.yml

permissions:
  contents: read

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARISANPRO_E2E_EMAIL: ${{ secrets.ARISANPRO_E2E_EMAIL }}
      ARISANPRO_E2E_PASSWORD: ${{ secrets.ARISANPRO_E2E_PASSWORD }}
      ARISANPRO_E2E_TARGET: http://127.0.0.1:4173/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run authenticated admin E2E on desktop/mobile
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/arisanpro-auth-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null || { cat /tmp/arisanpro-auth-http.log; exit 1; }
          cat > auth-e2e.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const email = process.env.ARISANPRO_E2E_EMAIL || '';
          const password = process.env.ARISANPRO_E2E_PASSWORD || '';
          const target = process.env.ARISANPRO_E2E_TARGET || '';

          if (!email || !password) {
            throw new Error(
              'Missing ARISANPRO_E2E_EMAIL / ARISANPRO_E2E_PASSWORD GitHub Actions secrets.'
            );
          }
          if (!target) throw new Error('Missing ARISANPRO_E2E_TARGET.');

          const errors = [];
          const summary = [];

          async function clickNav(page, label) {
            const candidates = [
              page.getByRole('button', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') }),
              page.locator('nav button').filter({ hasText: new RegExp('^\\s*' + label + '\\b', 'i') }),
              page.getByRole('link', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') })
            ];
            for (const locator of candidates) {
              if (await locator.count()) {
                await locator.first().click();
                return;
              }
            }
            throw new Error('Navigation control not found: ' + label);
          }

          async function findActionButton(page, label) {
            const exact = page.getByRole('button', { name: new RegExp('^\\s*' + label + '\\s*$', 'i') });
            if (await exact.count()) return exact.first();
            const partial = page.getByRole('button', { name: new RegExp(label, 'i') });
            if (await partial.count()) return partial.first();
            throw new Error('Action button not found: ' + label);
          }

          async function inspectViewport(name, viewport) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport,
              locale: 'id-ID'
            });
            const page = await context.newPage();
            await page.emulateMedia({ reducedMotion: 'reduce' });

            let phase = 'login';
            page.on('pageerror', e => errors.push({
              type: 'pageerror', viewport: name, phase, message: e.message
            }));
            page.on('console', m => {
              if (m.type() === 'error') errors.push({
                type: 'console-error', viewport: name, phase, message: m.text(),
                location: m.location()
              });
            });

            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);

            const loginButton = page.getByRole('button', { name: /Masuk Dashboard/i }).first();
            await loginButton.waitFor({ state: 'visible', timeout: 20000 });

            const passwordInput = page.locator('input[type="password"]').first();
            const userInput = page.locator('input:not([type="password"])').first();

            await passwordInput.fill(password);
            await userInput.fill(email);

            phase = 'signin';
            await loginButton.click();

            await page.waitForFunction(() => {
              const body = document.body?.innerText || '';
              const session = localStorage.getItem('arisan_session');
              const authReady = window.__awSupabaseAuthReady === true;
              const signedIn = !!session || authReady;
              return signedIn && !/Masuk sebagai Pengelola/i.test(body);
            }, { timeout: 30000 });

            await page.waitForTimeout(1500);

            const afterLogin = await page.evaluate(() => ({
              url: location.href,
              authReady: window.__awSupabaseAuthReady === true,
              hasSession: !!localStorage.getItem('arisan_session'),
              text: (document.body?.innerText || '').slice(0, 1200)
            }));

            if (!afterLogin.authReady && !afterLogin.hasSession) {
              throw new Error('Authenticated session was not established.');
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-dashboard.png`,
              fullPage: true, animations: 'disabled'
            });

            phase = 'member-quick-action';
            const addMemberQuick = await findActionButton(page, 'Tambah Anggota');
            await addMemberQuick.scrollIntoViewIfNeeded();
            await addMemberQuick.click();
            await page.waitForTimeout(500);

            const memberFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              return [...document.querySelectorAll('.fixed')].filter(visible).some(overlay => {
                const heading = [...overlay.querySelectorAll('h2,h3,h4')].some(h =>
                  /^Tambah Anggota Baru$|^Edit Anggota$/i.test((h.textContent || '').trim())
                );
                const fields = [...overlay.querySelectorAll('input,select,textarea')].filter(visible);
                return heading && fields.length >= 1;
              });
            });

            if (!memberFormVisible) {
              throw new Error(`${name}: Dashboard Quick Action "Tambah Anggota" did not open the member modal.`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'navigation';

            for (const tab of ['Dashboard', 'Anggota', 'Iuran', 'Undian', 'Laporan']) {
              await clickNav(page, tab);
              await page.waitForTimeout(700);
              const text = await page.locator('body').innerText();
              if (!new RegExp(tab, 'i').test(text)) {
                throw new Error(`${name}: tab "${tab}" did not render expected content.`);
              }
              const pageState = await page.evaluate(() => {
                const pages = [...document.querySelectorAll('#root main[data-aw-page]')].filter(el => {
                  const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden' && !el.hidden;
                });
                return {
                  visiblePages: pages.map(el => el.getAttribute('data-aw-page')),
                  overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
                };
              });
              if (pageState.visiblePages.length !== 1 || pageState.overflow) {
                throw new Error(`${name}: invalid app page visibility/overflow after "${tab}": ${JSON.stringify(pageState)}`);
              }
            }

            phase = 'finance-navigation';
            const financeButton = page.locator('button[data-aw-finance-nav]').filter({visible:true}).first();
            if (!(await financeButton.count())) {
              throw new Error(`${name}: no visible canonical finance navigation button. controls=${await page.locator('button').allTextContents()}`);
            }
            await financeButton.click();
            await page.waitForTimeout(1200);
            const financeState = await page.evaluate(() => {
              const w = document.querySelector('#aw-finance-workspace');
              const r = w?.getBoundingClientRect();
              const s = w ? getComputedStyle(w) : null;
              return {
                exists: !!w,
                visible: !!w && !!r && r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden',
                rootHidden: (() => {
                  const root = document.querySelector('#root');
                  if (!root) return true;
                  const rs = getComputedStyle(root);
                  return document.body.classList.contains('aw-finance-open') &&
                    (rs.display === 'none' || root.getBoundingClientRect().height === 0);
                })(),
                modules: [...document.querySelectorAll('#aw-fin-content > *')].map(x => x.id).filter(Boolean)
              };
            });
            if (!financeState.exists || !financeState.visible || (name === 'mobile' && !financeState.rootHidden)) {
              const diagnostic = await page.evaluate(async () => {
                const before = {
                  bodyClass: document.body.className,
                  navState: window.__AW_FINANCE_NAV_STATE__ || null,
                  openType: typeof window.__AW_FINANCE_NAV_OPEN__,
                  toggleType: typeof window.__AW_FINANCE_NAV_TOGGLE__,
                  financeButtons: [...document.querySelectorAll('button[data-aw-finance-nav]')].map(b => ({
                    text: (b.textContent || '').trim(),
                    visible: !!(b.offsetWidth || b.offsetHeight || b.getClientRects().length),
                    html: b.outerHTML.slice(0,500)
                  }))
                };
                try { await window.__AW_FINANCE_NAV_OPEN__?.(); } catch (e) {}
                await new Promise(r => setTimeout(r, 400));
                const w = document.querySelector('#aw-finance-workspace');
                const r = w?.getBoundingClientRect();
                const s = w ? getComputedStyle(w) : null;
                return {
                  before,
                  after: {
                    bodyClass: document.body.className,
                    navState: window.__AW_FINANCE_NAV_STATE__ || null,
                    visible: !!w && !!r && r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden',
                    rootHidden: document.body.classList.contains('aw-finance-open') &&
                      getComputedStyle(document.querySelector('#root') || document.body).display === 'none'
                  }
                };
              });
              throw new Error(`${name}: finance workspace did not open: state=${JSON.stringify(financeState)} diagnostic=${JSON.stringify(diagnostic)}`);
            }

            for (const mod of ['ledger', 'income', 'expense', 'audit', 'recon']) {
              const button = page.locator(`#aw-finance-workspace [data-fin-jump="${mod}"]`).first();
              if (!(await button.count())) throw new Error(`${name}: finance module button missing: ${mod}`);
              await button.click();
              await page.waitForTimeout(250);
              const active = await page.evaluate(key => {
                const b = document.querySelector(`#aw-finance-workspace [data-fin-jump="${key}"]`);
                return {
                  active: !!b && b.classList.contains('aw-fin-tool-active'),
                  target: (() => {
                    const map = {ledger:'aw-admin-ledger',income:'aw-inc-panel',expense:'aw-exp-panel',audit:'aw-v223-audit',recon:'aw-v224-reconciliation'};
                    const el = document.getElementById(map[key]);
                    return !!el && !!el.closest('#aw-fin-content');
                  })()
                };
              }, mod);
              if (!active.active || !active.target) {
                throw new Error(`${name}: finance module "${mod}" did not activate/mount correctly: ${JSON.stringify(active)}`);
              }
            }

            const closeFinance = page.locator('#aw-fin-close').first();
            if (!(await closeFinance.count())) throw new Error(`${name}: finance close button missing`);
            await closeFinance.click();
            await page.waitForTimeout(500);
            const closedFinance = await page.evaluate(() => ({
              open: document.body.classList.contains('aw-finance-open'),
              workspaceDisplay: getComputedStyle(document.querySelector('#aw-finance-workspace') || document.body).display,
              rootVisible: (() => {
                const root = document.querySelector('#root');
                if (!root) return false;
                const r = root.getBoundingClientRect(), s = getComputedStyle(root);
                return r.width > 0 && r.height > 0 && s.display !== 'none';
              })()
            }));
            if (closedFinance.open || !closedFinance.rootVisible) {
              throw new Error(`${name}: finance workspace did not close cleanly: ${JSON.stringify(closedFinance)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'payment-form';
            await clickNav(page, 'Iuran');
            await page.waitForTimeout(700);

            const addPayment = await findActionButton(page, 'Catat Iuran');
            await addPayment.scrollIntoViewIfNeeded();
            await addPayment.click();
            await page.waitForTimeout(400);

            const paymentFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              const forms = [...document.querySelectorAll('form,[role="dialog"],dialog,.fixed')].filter(visible);
              return forms.some(form => {
                const text = form.innerText || '';
                const fields = [...form.querySelectorAll('input,select,textarea')].filter(visible);
                const fieldText = fields.map(x =>
                  (x.placeholder || '') + ' ' + (x.getAttribute('aria-label') || '') + ' ' + (x.name || '')
                ).join(' ');
                return fields.length > 0 && /nominal|anggota|periode|tanggal|bayar/i.test(text + ' ' + fieldText);
              });
            });

            if (!paymentFormVisible) {
              throw new Error(`${name}: Catat Iuran did not open a visible form.`);
            }

            const finalState = await page.evaluate(() => ({
              sessionEmail: (() => {
                try {
                  return JSON.parse(localStorage.getItem('arisan_session') || '{}').email || null;
                } catch {
                  return null;
                }
              })(),
              authReady: window.__awSupabaseAuthReady === true,
              viewport: { width: innerWidth, height: innerHeight },
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              visibleNaN: /\\bNaN\\b|Rp\\s*NaN/i.test(document.body?.innerText || '')
            }));

            if (finalState.visibleNaN) {
              throw new Error(`${name}: authenticated UI contains visible NaN.`);
            }
            if (finalState.horizontalOverflow) {
              throw new Error(`${name}: authenticated UI has horizontal overflow.`);
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-iuran-form.png`,
              fullPage: true, animations: 'disabled'
            });

            summary.push({
              viewport: name,
              authenticated: true,
              authReady: finalState.authReady,
              sessionPresent: !!finalState.sessionEmail,
              checkedTabs: ['Anggota', 'Iuran', 'Undian', 'Laporan'],
              tambahAnggotaFormVisible: memberFormVisible,
              catatIuranFormVisible: paymentFormVisible,
              horizontalOverflow: finalState.horizontalOverflow,
              visibleNaN: finalState.visibleNaN
            });

            await context.close();
            await browser.close();
          }

          (async () => {
            try {
              await inspectViewport('desktop', { width: 1440, height: 1000 });
              await inspectViewport('mobile', { width: 390, height: 844 });

              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));

              if (errors.length) {
                throw new Error('Authenticated E2E produced browser errors: ' + JSON.stringify(errors));
              }

              console.log(JSON.stringify({ summary }, null, 2));
              console.log('Authenticated admin E2E completed without financial mutations.');
            } catch (error) {
              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));
              throw error;
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node auth-e2e.cjs

      - name: Upload authenticated E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arisanpro-auth-e2e-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
