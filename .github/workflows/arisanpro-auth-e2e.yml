name: ArisanPro Authenticated E2E

on:
  pull_request:
    paths:
      - 'index.html'
      - '.github/workflows/arisanpro-auth-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

# Responsive acceptance test checkpoint — PR #40

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARISANPRO_E2E_EMAIL: ${{ secrets.ARISANPRO_E2E_EMAIL }}
      ARISANPRO_E2E_PASSWORD: ${{ secrets.ARISANPRO_E2E_PASSWORD }}
      ARISANPRO_E2E_TARGET: http://127.0.0.1:4173/
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run authenticated admin E2E on desktop/mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/arisanpro-auth-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null || { cat /tmp/arisanpro-auth-http.log; exit 1; }

          mkdir -p test-results
          cat > auth-e2e.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const email = process.env.ARISANPRO_E2E_EMAIL || '';
          const password = process.env.ARISANPRO_E2E_PASSWORD || '';
          const target = process.env.ARISANPRO_E2E_TARGET || '';

          if (!email || !password) {
            throw new Error(
              'Missing ARISANPRO_E2E_EMAIL / ARISANPRO_E2E_PASSWORD GitHub Actions secrets.'
            );
          }
          if (!target) throw new Error('Missing ARISANPRO_E2E_TARGET.');

          const errors = [];
          const summary = [];

          async function clickNav(page, label) {
            const deadline = Date.now() + 8000;
            while (Date.now() < deadline) {
              const candidates = [
                page.getByRole('button', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') }),
                page.locator('nav button').filter({ hasText: new RegExp('^\\s*' + label + '\\b', 'i') }),
                page.getByRole('link', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') })
              ];
              for (const locator of candidates) {
                if (await locator.count()) {
                  const first = locator.first();
                  if (await first.isVisible().catch(() => false)) {
                    await first.click();
                    return;
                  }
                }
              }
              await page.waitForTimeout(200);
            }
            throw new Error('Navigation control not found: ' + label);
          }

          async function findActionButton(page, label) {
            const exact = page.getByRole('button', { name: new RegExp('^\\s*' + label + '\\s*$', 'i') });
            if (await exact.count()) return exact.first();
            const partial = page.getByRole('button', { name: new RegExp(label, 'i') });
            if (await partial.count()) return partial.first();
            throw new Error('Action button not found: ' + label);
          }

          async function inspectViewport(name, viewport) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport,
              locale: 'id-ID'
            });
            const page = await context.newPage();
            await page.emulateMedia({ reducedMotion: 'reduce' });

            let phase = 'login';
            page.on('pageerror', e => errors.push({
              type: 'pageerror', viewport: name, phase, message: e.message
            }));
            page.on('console', m => {
              if (m.type() === 'error') errors.push({
                type: 'console-error', viewport: name, phase, message: m.text(),
                location: m.location()
              });
            });

            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);

            const loginButton = page.getByRole('button', { name: /Masuk Dashboard/i }).first();
            await loginButton.waitFor({ state: 'visible', timeout: 20000 });

            const passwordInput = page.locator('input[type="password"]').first();
            const userInput = page.locator('input:not([type="password"])').first();

            await passwordInput.fill(password);
            await userInput.fill(email);

            phase = 'signin';
            await loginButton.click();

            await page.waitForFunction(() => {
              const body = document.body?.innerText || '';
              const session = localStorage.getItem('arisan_session');
              const authReady = window.__awSupabaseAuthReady === true;
              const signedIn = !!session || authReady;
              return signedIn && !/Masuk sebagai Pengelola/i.test(body);
            }, { timeout: 30000 });

            await page.waitForTimeout(1500);

            const afterLogin = await page.evaluate(() => ({
              url: location.href,
              authReady: window.__awSupabaseAuthReady === true,
              hasSession: !!localStorage.getItem('arisan_session'),
              text: (document.body?.innerText || '').slice(0, 1200)
            }));

            if (!afterLogin.authReady && !afterLogin.hasSession) {
              throw new Error('Authenticated session was not established.');
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-dashboard.png`,
              fullPage: true, animations: 'disabled'
            });

            phase = 'member-quick-action';
            const addMemberQuick = await findActionButton(page, 'Tambah Anggota');
            await addMemberQuick.scrollIntoViewIfNeeded();
            await addMemberQuick.click();
            await page.waitForTimeout(500);

            const memberFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              return [...document.querySelectorAll('.fixed')].filter(visible).some(overlay => {
                const heading = [...overlay.querySelectorAll('h2,h3,h4')].some(h =>
                  /^Tambah Anggota Baru$|^Edit Anggota$/i.test((h.textContent || '').trim())
                );
                const fields = [...overlay.querySelectorAll('input,select,textarea')].filter(visible);
                return heading && fields.length >= 1;
              });
            });

            if (!memberFormVisible) {
              throw new Error(`${name}: Dashboard Quick Action "Tambah Anggota" did not open the member modal.`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'navigation';

            await clickNav(page, 'Anggota');
            await page.waitForTimeout(700);

            const memberLayout = await page.evaluate(() => {
              const grid = document.querySelector('main[data-aw-page="anggota"] .grid.md\\:grid-cols-2.xl\\:grid-cols-3');
              if (!grid) return { found: false };
              const gridRect = grid.getBoundingClientRect();
              const cards = [...grid.children].filter(el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none';
              });
              const rows = [];
              for (const card of cards) {
                const r = card.getBoundingClientRect();
                if (!rows.some(y => Math.abs(y - r.top) <= 2)) rows.push(r.top);
              }
              const firstCard = cards[0]?.getBoundingClientRect() || null;
              const secondCard = cards[1]?.getBoundingClientRect() || null;
              const firstName = cards[0]?.querySelector('.font-bold.text-sm');
              return {
                found: true,
                cardCount: cards.length,
                rowCount: rows.length,
                gridWidth: gridRect.width,
                firstCardWidth: firstCard?.width ?? 0,
                secondCardWidth: secondCard?.width ?? 0,
                titleFontSize: firstName ? getComputedStyle(firstName).fontSize : null,
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!memberLayout.found || memberLayout.cardCount < 2) {
              throw new Error(`${name}: Anggota member-card grid did not render at least two visible cards.`);
            }

            if (name === 'mobile') {
              if (memberLayout.rowCount >= memberLayout.cardCount) {
                throw new Error(`${name}: Anggota cards are not arranged side-by-side on mobile: ${JSON.stringify(memberLayout)}`);
              }
              if (memberLayout.firstCardWidth > memberLayout.gridWidth * 0.70) {
                throw new Error(`${name}: mobile member cards are too wide / not compact: ${JSON.stringify(memberLayout)}`);
              }
            }

            if (memberLayout.horizontalOverflow) {
              throw new Error(`${name}: Anggota layout has horizontal overflow: ${JSON.stringify(memberLayout)}`);
            }

            await clickNav(page, 'Iuran');
            await page.waitForTimeout(700);

            const iuranLayout = await page.evaluate(() => {
              const main = document.querySelector('main[data-aw-page="iuran"]');
              if (!main) return { found: false };

              const add = main.querySelector('[data-aw-v121-iuran-add]');
              const matrix = main.querySelector('[data-aw-v121-iuran-matrix]');
              const matrixRect = matrix?.getBoundingClientRect() || null;
              const addRect = add?.getBoundingClientRect() || null;
              const headerText = matrix?.querySelector('thead')?.innerText || '';
              const periodSummaryHeading = [...main.querySelectorAll('h4')].find(x =>
                /Rekap per Periode/i.test(x.textContent || '')
              );
              const periodSummary = periodSummaryHeading?.parentElement || null;

              return {
                found: true,
                addFound: !!add,
                matrixFound: !!matrix,
                addWidth: addRect?.width ?? 0,
                matrixClientWidth: matrix?.clientWidth ?? 0,
                matrixClientHeight: matrix?.clientHeight ?? 0,
                matrixScrollWidth: matrix?.scrollWidth ?? 0,
                matrixScrollHeight: matrix?.scrollHeight ?? 0,
                matrixOverflowX: getComputedStyle(matrix || document.body).overflowX,
                matrixOverflowY: getComputedStyle(matrix || document.body).overflowY,
                headerText,
                periodRangeText: main.innerText.match(/Periode\s+1\s*-\s*6/i)?.[0] || null,
                periodHeaderCount: matrix?.querySelectorAll('thead th')?.length ?? 0,
                periodSummaryVisible: !!periodSummaryHeading,
                periodSummaryCards: periodSummary ? periodSummary.querySelectorAll('.grid > div').length : 0,
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!iuranLayout.found || !iuranLayout.addFound || !iuranLayout.matrixFound) {
              throw new Error(`${name}: Iuran action/matrix structure is incomplete: ${JSON.stringify(iuranLayout)}`);
            }
            if (!iuranLayout.periodRangeText) {
              throw new Error(`${name}: Iuran period range control is missing/non-canonical: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.periodHeaderCount < 7) {
              throw new Error(`${name}: Iuran matrix does not render the expected period columns plus total: ${JSON.stringify(iuranLayout)}`);
            }
            if (!iuranLayout.periodSummaryVisible || iuranLayout.periodSummaryCards < 2) {
              throw new Error(`${name}: Iuran period recap collapsed/does not render multiple period cards: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.addWidth <= 0 || iuranLayout.addWidth > 240) {
              throw new Error(`${name}: Iuran Catat Iuran button width is disproportionate: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.matrixClientWidth <= 0 || iuranLayout.matrixClientHeight <= 0) {
              throw new Error(`${name}: Iuran matrix has no measurable internal scroll viewport: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.matrixScrollWidth <= iuranLayout.matrixClientWidth) {
              throw new Error(`${name}: Iuran matrix lost horizontal internal scrolling: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.matrixScrollHeight <= iuranLayout.matrixClientHeight) {
              throw new Error(`${name}: Iuran matrix lost vertical internal scrolling: ${JSON.stringify(iuranLayout)}`);
            }
            if (!/auto|scroll/i.test(iuranLayout.matrixOverflowX) || !/auto|scroll/i.test(iuranLayout.matrixOverflowY)) {
              throw new Error(`${name}: Iuran matrix overflow ownership is not internal: ${JSON.stringify(iuranLayout)}`);
            }
            if (iuranLayout.horizontalOverflow) {
              throw new Error(`${name}: Iuran page has horizontal overflow outside its intended matrix scroller: ${JSON.stringify(iuranLayout)}`);
            }

            for (const tab of ['Anggota', 'Iuran', 'Undian', 'Laporan']) {
              await clickNav(page, tab);
              await page.waitForTimeout(700);
              const text = await page.locator('body').innerText();
              if (!new RegExp(tab, 'i').test(text)) {
                throw new Error(`${name}: tab "${tab}" did not render expected content.`);
              }
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'undian-admin';
            await clickNav(page, 'Undian');
            await page.waitForTimeout(700);

            const undianAudit = await page.evaluate(() => {
              const root = document.querySelector('main[data-aw-page="undian"]');
              if (!root) return { found: false };

              const cancelButtons = [...root.querySelectorAll('[data-aw-v121-winner-id]')].filter(b => {
                const r = b.getBoundingClientRect();
                return r.width > 0 && r.height > 0 && getComputedStyle(b).display !== 'none';
              });
              const cancelIds = [...new Set(cancelButtons.map(b => String(b.getAttribute('data-aw-v121-winner-id') || '')))].filter(Boolean);
              const resetButton = [...root.querySelectorAll('button')].find(b => /^Reset Pemenang$/i.test((b.textContent || '').trim()));
              const sqlButtons = [...root.querySelectorAll('button,[role="button"]')].filter(b =>
                /SQL\\s*Pembayaran|Pembayaran\\s*SQL/i.test((b.textContent || '').replace(/\\s+/g,' ').trim())
              );

              return {
                found: true,
                cancelButtonCount: cancelButtons.length,
                cancelWinnerIds: cancelIds,
                resetButtonVisible: !!resetButton && (() => {
                  const r = resetButton.getBoundingClientRect();
                  return r.width > 0 && r.height > 0 && getComputedStyle(resetButton).display !== 'none';
                })(),
                sqlPaymentButtonCount: sqlButtons.length,
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!undianAudit.found || !undianAudit.resetButtonVisible) {
              throw new Error(`${name}: Undian admin controls are incomplete: ${JSON.stringify(undianAudit)}`);
            }
            if (undianAudit.sqlPaymentButtonCount !== 0) {
              throw new Error(`${name}: legacy "SQL Pembayaran" control is still visible: ${JSON.stringify(undianAudit)}`);
            }
            if (undianAudit.horizontalOverflow) {
              throw new Error(`${name}: Undian page has horizontal overflow.`);
            }

            if (undianAudit.cancelWinnerIds.length > 0) {
              const rpcCalls = [];
              await page.route('**/rest/v1/rpc/reset_pemenang', async route => {
                const body = route.request().postData();
                let args = null;
                try { args = body ? JSON.parse(body) : null; } catch {}
                rpcCalls.push({ fn: 'reset_pemenang', args });
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({ live_cleared: true, reversed_amount: 0 })
                });
              });

              const dialogs = dialog => dialog.accept();
              page.on('dialog', dialogs);

              phase = 'undian-cancel-spy';
              const cancel = page.locator('[data-aw-v121-winner-id="' + undianAudit.cancelWinnerIds[0] + '"]').first();
              await cancel.click();
              await page.waitForTimeout(500);

              const cancelRpcAudit = rpcCalls.filter(x => x.fn === 'reset_pemenang');
              if (!cancelRpcAudit.length) {
                throw new Error(`${name}: Batalkan Pemenang did not route through reset_pemenang RPC.`);
              }

              // Reload to isolate Reset Pemenang from cancel-triggered async refresh.
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => {
                const session = localStorage.getItem('arisan_session');
                return !!session || window.__awSupabaseAuthReady === true;
              }, { timeout: 30000 });
              await page.waitForTimeout(1000);
              await clickNav(page, 'Undian');
              await page.waitForTimeout(700);

              phase = 'undian-reset-spy';
              const beforeResetRpcCount = rpcCalls.length;
              const reset = page.getByRole('button', { name: /^Reset Pemenang$/i }).first();
              await reset.click();
              await page.waitForTimeout(900);

              const resetRpcAudit = rpcCalls
                .filter(x => x.fn === 'reset_pemenang')
                .slice(beforeResetRpcCount);

              if (resetRpcAudit.length < undianAudit.cancelWinnerIds.length) {
                throw new Error(`${name}: Reset Pemenang did not route all winners through reset_pemenang RPC: ${JSON.stringify(resetRpcAudit)}`);
              }

              page.off('dialog', dialogs);
              await page.unroute('**/rest/v1/rpc/reset_pemenang');
            }

            phase = 'laporan-ui';
            await clickNav(page, 'Laporan');
            await page.waitForTimeout(800);

            const laporanLayout = await page.evaluate(() => {
              const main = document.querySelector('main[data-aw-page="laporan"]');
              if (!main) return { found: false };

              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };

              const measure = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  width: r.width,
                  height: r.height,
                  clientWidth: el.clientWidth,
                  clientHeight: el.clientHeight,
                  scrollWidth: el.scrollWidth,
                  scrollHeight: el.scrollHeight,
                  overflowX: s.overflowX,
                  overflowY: s.overflowY,
                  maxHeight: parseFloat(s.maxHeight) || 0
                };
              };

              const controlHeight = el => el ? el.getBoundingClientRect().height : null;

              const findReport = headingPattern => {
                const heading = [...main.querySelectorAll('h3,h4')].find(h =>
                  headingPattern.test((h.textContent || '').trim())
                );
                if (!heading) return { heading: null, panel: null, table: null, scroll: null };

                let panel = null;
                let table = null;
                for (let el = heading; el && el !== main; el = el.parentElement) {
                  if (!table && el.querySelector('table')) table = el.querySelector('table');
                  if (!panel && (el.classList.contains('aw-pr-box') || el.classList.contains('bg-white'))) {
                    panel = el;
                  }
                }

                if (!panel && table) {
                  for (let el = table.parentElement; el && el !== main; el = el.parentElement) {
                    if (el.querySelector('h3,h4') === heading || el.textContent.includes((heading.textContent || '').trim())) {
                      panel = el;
                      break;
                    }
                  }
                }

                let scroll = null;
                if (table) {
                  for (let el = table.parentElement; el && el !== main; el = el.parentElement) {
                    const s = getComputedStyle(el);
                    if (visible(el) && /auto|scroll/i.test(s.overflowX) && /auto|scroll/i.test(s.overflowY)) {
                      scroll = el;
                      break;
                    }
                  }
                }

                return { heading, panel, table, scroll };
              };

              const latest = findReport(/^Transaksi Kas Terbaru$/i);
              const detail = findReport(/^Riwayat Transaksi Detail$/i);

              const filter = main.querySelector('.aw-pr-filter') ||
                latest.heading?.parentElement?.querySelector?.('.aw-pr-filter') || null;
              const periodFilter = main.querySelector('#aw-pr-tx-period');
              const fromFilter = main.querySelector('#aw-pr-tx-from');
              const toFilter = main.querySelector('#aw-pr-tx-to');
              const resetFilter = main.querySelector('#aw-pr-tx-clear');
              const printButton = [...main.querySelectorAll('button')].find(b =>
                /Cetak Laporan/i.test((b.textContent || '').trim())
              );

              return {
                found: true,
                latestFound: visible(latest.heading),
                detailFound: visible(detail.heading),
                latestScrollFound: visible(latest.scroll),
                detailScrollFound: visible(detail.scroll),
                latest: measure(latest.panel),
                detail: measure(detail.panel),
                latestScroll: measure(latest.scroll),
                detailScroll: measure(detail.scroll),
                latestTable: measure(latest.table),
                detailTable: measure(detail.table),
                latestFilterFound: !!filter,
                periodFilterFound: !!periodFilter,
                fromFilterFound: !!fromFilter,
                toFilterFound: !!toFilter,
                resetFilterFound: !!resetFilter,
                filterControlHeights: [
                  controlHeight(periodFilter),
                  controlHeight(fromFilter),
                  controlHeight(toFilter),
                  controlHeight(resetFilter)
                ],
                printButtonVisible: visible(printButton),
                latestScrollSeparateFromDetail: !!latest.scroll && !!detail.scroll && latest.scroll !== detail.scroll,
                headingTexts: [...main.querySelectorAll('h3,h4')].map(x => (x.textContent || '').trim())
                  .filter(Boolean).filter(x => /Laporan Keuangan Profesional|Transaksi Kas Terbaru|Riwayat Transaksi Detail/i.test(x)),
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!laporanLayout.found ||
                !laporanLayout.latestFound ||
                !laporanLayout.detailFound ||
                !laporanLayout.latestScrollFound ||
                !laporanLayout.detailScrollFound ||
                !laporanLayout.latestScrollSeparateFromDetail) {
              throw new Error(`${name}: Laporan report blocks/scroll containers are incomplete or shared incorrectly: ${JSON.stringify(laporanLayout)}`);
            }
            if (!laporanLayout.latestFilterFound ||
                !laporanLayout.periodFilterFound ||
                !laporanLayout.fromFilterFound ||
                !laporanLayout.toFilterFound ||
                !laporanLayout.resetFilterFound) {
              throw new Error(`${name}: Laporan transaction filter controls are incomplete: ${JSON.stringify(laporanLayout)}`);
            }
            if (!laporanLayout.printButtonVisible) {
              throw new Error(`${name}: Riwayat Transaksi Detail print action is missing.`);
            }
            if (laporanLayout.horizontalOverflow) {
              throw new Error(`${name}: Laporan page has horizontal overflow outside intended table scrollers.`);
            }

            if (laporanLayout.latestScroll.clientWidth <= 0 ||
                laporanLayout.detailScroll.clientWidth <= 0 ||
                laporanLayout.latestScroll.clientHeight <= 0 ||
                laporanLayout.detailScroll.clientHeight <= 0) {
              throw new Error(`${name}: Laporan scroll containers have no measurable viewport: ${JSON.stringify(laporanLayout)}`);
            }

            if (!/auto|scroll/i.test(laporanLayout.latestScroll.overflowX) ||
                !/auto|scroll/i.test(laporanLayout.latestScroll.overflowY) ||
                !/auto|scroll/i.test(laporanLayout.detailScroll.overflowX) ||
                !/auto|scroll/i.test(laporanLayout.detailScroll.overflowY)) {
              throw new Error(`${name}: Laporan report scroll ownership is not internal: ${JSON.stringify(laporanLayout)}`);
            }

            if (name === 'desktop' && (
                !laporanLayout.latestScroll.maxHeight ||
                !laporanLayout.detailScroll.maxHeight)) {
              throw new Error(`${name}: Laporan desktop scroll containers lack bounded max-height ownership: ${JSON.stringify(laporanLayout)}`);
            }

            if (name === 'mobile') {
              if (laporanLayout.latestScroll.scrollWidth <= laporanLayout.latestScroll.clientWidth ||
                  laporanLayout.detailScroll.scrollWidth <= laporanLayout.detailScroll.clientWidth) {
                throw new Error(`${name}: Laporan tables do not retain intended horizontal scrolling on mobile: ${JSON.stringify(laporanLayout)}`);
              }
              const badControl = laporanLayout.filterControlHeights.some(h => h != null && (h < 20 || h > 44));
              if (badControl) {
                throw new Error(`${name}: Laporan filter controls are disproportionately tall/small: ${JSON.stringify(laporanLayout)}`);
              }
            }

            phase = 'finance-workspace';
            const financeControllerReady = await page.evaluate(() =>
              typeof window.__AW_FINANCE_NAV_OPEN__ === 'function'
            );
            if (!financeControllerReady) {
              throw new Error(`${name}: Finance navigation controller is not registered.`);
            }
            await page.evaluate(() => window.__AW_FINANCE_NAV_OPEN__());
            await page.waitForTimeout(900);

            const financeLayout = await page.evaluate(() => {
              const workspace = document.getElementById('aw-finance-workspace');
              const content = document.getElementById('aw-fin-content');
              const ledger = document.getElementById('aw-v22541-proof');
              const tableWrap = ledger?.querySelector('.al-table-wrap');
              const table = ledger?.querySelector('.al-table');
              const head = ledger?.querySelector('.al-head');
              const title = ledger?.querySelector('.al-title');
              const body = ledger?.querySelector('.al-body');
              const actionCards = ledger?.querySelectorAll('.al-actions .al-action') || [];
              const summaryCards = ledger?.querySelectorAll('.al-summary .al-card') || [];

              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              const measure = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  width: r.width,
                  height: r.height,
                  clientWidth: el.clientWidth,
                  clientHeight: el.clientHeight,
                  scrollWidth: el.scrollWidth,
                  scrollHeight: el.scrollHeight,
                  overflowX: s.overflowX,
                  overflowY: s.overflowY,
                  maxHeight: parseFloat(s.maxHeight) || 0
                };
              };

              return {
                financeOpen: document.body.classList.contains('aw-finance-open'),
                workspaceVisible: visible(workspace),
                contentVisible: visible(content),
                ledgerVisible: visible(ledger),
                workspace: measure(workspace),
                ledger: measure(ledger),
                head: measure(head),
                body: measure(body),
                tableWrap: measure(tableWrap),
                table: measure(table),
                titleFontSize: title ? getComputedStyle(title).fontSize : null,
                summaryCardCount: summaryCards.length,
                actionCardCount: actionCards.length,
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!financeLayout.financeOpen ||
                !financeLayout.workspaceVisible ||
                !financeLayout.contentVisible ||
                !financeLayout.ledgerVisible) {
              throw new Error(`${name}: Finance Workspace/Ledger did not open correctly: ${JSON.stringify(financeLayout)}`);
            }
            if (financeLayout.summaryCardCount < 4 || financeLayout.actionCardCount < 4) {
              throw new Error(`${name}: Finance Ledger lost summary/action cards: ${JSON.stringify(financeLayout)}`);
            }
            if (!financeLayout.tableWrap ||
                financeLayout.tableWrap.clientWidth <= 0 ||
                financeLayout.tableWrap.clientHeight <= 0 ||
                !/auto|scroll/i.test(financeLayout.tableWrap.overflowX) ||
                !/auto|scroll/i.test(financeLayout.tableWrap.overflowY)) {
              throw new Error(`${name}: Finance Ledger table does not own an internal scroll container: ${JSON.stringify(financeLayout)}`);
            }
            if (name === 'mobile') {
              if (financeLayout.workspace.width > 390 + 1 ||
                  financeLayout.ledger.width > 390 + 1) {
                throw new Error(`${name}: Finance Ledger is wider than the mobile viewport: ${JSON.stringify(financeLayout)}`);
              }
              if (!financeLayout.titleFontSize || parseFloat(financeLayout.titleFontSize) > 20) {
                throw new Error(`${name}: Finance Ledger title is disproportionately large on mobile: ${JSON.stringify(financeLayout)}`);
              }
              if (financeLayout.tableWrap.scrollWidth <= financeLayout.tableWrap.clientWidth) {
                throw new Error(`${name}: Finance Ledger history table lost horizontal internal scrolling on mobile: ${JSON.stringify(financeLayout)}`);
              }
            }
            if (financeLayout.horizontalOverflow) {
              throw new Error(`${name}: Finance Workspace caused page-level horizontal overflow: ${JSON.stringify(financeLayout)}`);
            }

            await page.evaluate(() => window.__AW_FINANCE_NAV_CLOSE__?.());
            await page.waitForTimeout(300);
            await clickNav(page, 'Laporan');
            await page.waitForTimeout(500);

            phase = 'share-page';
            const shareControllerReady = await page.evaluate(() =>
              typeof window.__arisanUiActions?.goToPage === 'function'
            );
            if (!shareControllerReady) {
              throw new Error(`${name}: Share page controller is not registered.`);
            }
            await page.evaluate(() => window.__arisanUiActions.goToPage('share'));
            await page.waitForTimeout(800);

            const shareLayout = await page.evaluate(() => {
              const main = document.querySelector('main[data-aw-page="share"]');
              if (!main) return { found: false };

              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };

              const copyButton = [...main.querySelectorAll('button')].find(b =>
                /^Copy Link$/i.test((b.textContent || '').trim())
              );
              const qr = main.querySelector('img[alt="QR Code Share Link"]');
              const qrBig = [...main.querySelectorAll('button')].find(b =>
                /Buka QR Besar/i.test((b.textContent || '').trim())
              );
              const publicPreview = [...main.querySelectorAll('button')].find(b =>
                /Buka Halaman Publik \(Simulasi\)/i.test((b.textContent || '').trim())
              );
              const liveText = /LIVE|Offline/i.test(main.innerText || '');
              const linkText = [...main.querySelectorAll('div,span,p')].some(el =>
                /Link asli:/i.test((el.textContent || '').trim())
              );

              return {
                found: true,
                copyButtonVisible: visible(copyButton),
                qrVisible: visible(qr),
                qrSrc: qr?.getAttribute('src') || null,
                qrBigVisible: visible(qrBig),
                publicPreviewVisible: visible(publicPreview),
                liveText,
                linkText,
                horizontalOverflow: document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1
              };
            });

            if (!shareLayout.found ||
                !shareLayout.copyButtonVisible ||
                !shareLayout.qrVisible ||
                !shareLayout.qrBigVisible ||
                !shareLayout.publicPreviewVisible ||
                !shareLayout.linkText) {
              throw new Error(`${name}: Share/Warga Link controls are incomplete: ${JSON.stringify(shareLayout)}`);
            }
            if (!shareLayout.qrSrc || !/^https:\/\/api\.qrserver\.com\/v1\/create-qr-code\//i.test(shareLayout.qrSrc)) {
              throw new Error(`${name}: Share QR code source is missing/non-canonical: ${JSON.stringify(shareLayout)}`);
            }
            if (shareLayout.horizontalOverflow) {
              throw new Error(`${name}: Share page has horizontal overflow.`);
            }

            phase = 'share-copy';
            const copyButton = page.getByRole('button', { name: /^Copy Link$/i }).first();
            await page.evaluate(() => {
              navigator.clipboard?.writeText?.('about:blank').catch(() => {});
            }).catch(() => {});
            await copyButton.click();
            await page.waitForTimeout(300);

            const shareBodyText = await page.locator('body').innerText();
            if (!/link|disalin|copied|berhasil/i.test(shareBodyText)) {
              throw new Error(`${name}: Copy Link did not produce an observable success/status response.`);
            }

            phase = 'share-public-simulation';
            const sim = page.getByRole('button', { name: /Buka Halaman Publik \(Simulasi\)/i }).first();
            await sim.click();
            await page.waitForTimeout(350);

            // The simulation is a React state transition that replaces the
            // authenticated surface. Success criterion is that the click
            // completes without browser/page errors. The actual public portal
            // remains covered by the canonical Playwright Smoke Test.

            // Return to a clean authenticated app boundary before the remaining
            // admin-flow checks; simulation is intentionally isolated.
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(900);

            phase = 'payment-form';
            await clickNav(page, 'Iuran');
            await page.waitForTimeout(700);

            const addPayment = await findActionButton(page, 'Catat Iuran');
            await addPayment.scrollIntoViewIfNeeded();
            await addPayment.click();
            await page.waitForTimeout(400);

            const paymentFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              const forms = [...document.querySelectorAll('form,[role="dialog"],dialog,.fixed')].filter(visible);
              return forms.some(form => {
                const text = form.innerText || '';
                const fields = [...form.querySelectorAll('input,select,textarea')].filter(visible);
                const fieldText = fields.map(x =>
                  (x.placeholder || '') + ' ' + (x.getAttribute('aria-label') || '') + ' ' + (x.name || '')
                ).join(' ');
                return fields.length > 0 && /nominal|anggota|periode|tanggal|bayar/i.test(text + ' ' + fieldText);
              });
            });

            if (!paymentFormVisible) {
              throw new Error(`${name}: Catat Iuran did not open a visible form.`);
            }

            const finalState = await page.evaluate(() => ({
              sessionEmail: (() => {
                try {
                  return JSON.parse(localStorage.getItem('arisan_session') || '{}').email || null;
                } catch {
                  return null;
                }
              })(),
              authReady: window.__awSupabaseAuthReady === true,
              viewport: { width: innerWidth, height: innerHeight },
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              visibleNaN: /\\bNaN\\b|Rp\\s*NaN/i.test(document.body?.innerText || '')
            }));

            if (finalState.visibleNaN) {
              throw new Error(`${name}: authenticated UI contains visible NaN.`);
            }
            if (finalState.horizontalOverflow) {
              throw new Error(`${name}: authenticated UI has horizontal overflow.`);
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-iuran-form.png`,
              fullPage: true, animations: 'disabled'
            });

            summary.push({
              viewport: name,
              authenticated: true,
              authReady: finalState.authReady,
              sessionPresent: !!finalState.sessionEmail,
              checkedTabs: ['Anggota', 'Iuran', 'Undian', 'Laporan'],
              memberLayout,
              iuranLayout,
              undianAudit,
              laporanLayout,
              financeLayout,
              shareLayout,
              tambahAnggotaFormVisible: memberFormVisible,
              catatIuranFormVisible: paymentFormVisible,
              horizontalOverflow: finalState.horizontalOverflow,
              visibleNaN: finalState.visibleNaN
            });

            await context.close();
            await browser.close();
          }

          (async () => {
            try {
              await inspectViewport('desktop', { width: 1440, height: 1000 });
              await inspectViewport('mobile', { width: 390, height: 844 });

              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));

              if (errors.length) {
                throw new Error('Authenticated E2E produced browser errors: ' + JSON.stringify(errors));
              }

              console.log(JSON.stringify({ summary }, null, 2));
              console.log('Authenticated admin E2E completed without financial mutations.');
            } catch (error) {
              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));
              throw error;
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node auth-e2e.cjs

      - name: Upload authenticated E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arisanpro-auth-e2e-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
