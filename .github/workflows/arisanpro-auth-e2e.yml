name: ArisanPro Authenticated E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dashboard-ui-functional-hardening-v1
    paths:
      - index.html
      - .github/workflows/arisanpro-auth-e2e.yml

permissions:
  contents: read

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARISANPRO_E2E_EMAIL: ${{ secrets.ARISANPRO_E2E_EMAIL }}
      ARISANPRO_E2E_PASSWORD: ${{ secrets.ARISANPRO_E2E_PASSWORD }}
      ARISANPRO_E2E_TARGET: http://127.0.0.1:4173/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run authenticated admin E2E on desktop/mobile
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/arisanpro-auth-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null || { cat /tmp/arisanpro-auth-http.log; exit 1; }
          cat > auth-e2e.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const email = process.env.ARISANPRO_E2E_EMAIL || '';
          const password = process.env.ARISANPRO_E2E_PASSWORD || '';
          const target = process.env.ARISANPRO_E2E_TARGET || '';

          if (!email || !password) {
            throw new Error(
              'Missing ARISANPRO_E2E_EMAIL / ARISANPRO_E2E_PASSWORD GitHub Actions secrets.'
            );
          }
          if (!target) throw new Error('Missing ARISANPRO_E2E_TARGET.');

          const errors = [];
          const summary = [];

          async function clickNav(page, label) {
            const candidates = [
              page.getByRole('button', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') }),
              page.locator('nav button').filter({ hasText: new RegExp('^\\s*' + label + '\\b', 'i') }),
              page.getByRole('link', { name: new RegExp('^' + label + '(?:\\s|$)', 'i') })
            ];
            for (const locator of candidates) {
              if (await locator.count()) {
                await locator.first().click();
                return;
              }
            }
            throw new Error('Navigation control not found: ' + label);
          }

          async function findActionButton(page, label) {
            const exact = page.getByRole('button', { name: new RegExp('^\\s*' + label + '\\s*$', 'i') });
            if (await exact.count()) return exact.first();
            const partial = page.getByRole('button', { name: new RegExp(label, 'i') });
            if (await partial.count()) return partial.first();
            throw new Error('Action button not found: ' + label);
          }

          async function inspectViewport(name, viewport) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport,
              locale: 'id-ID'
            });
            const page = await context.newPage();
            await page.emulateMedia({ reducedMotion: 'reduce' });

            let phase = 'login';
            page.on('pageerror', e => errors.push({
              type: 'pageerror', viewport: name, phase, message: e.message
            }));
            page.on('console', m => {
              if (m.type() === 'error') errors.push({
                type: 'console-error', viewport: name, phase, message: m.text(),
                location: m.location()
              });
            });

            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);

            const loginButton = page.getByRole('button', { name: /Masuk Dashboard/i }).first();
            await loginButton.waitFor({ state: 'visible', timeout: 20000 });

            const passwordInput = page.locator('input[type="password"]').first();
            const userInput = page.locator('input:not([type="password"])').first();

            await passwordInput.fill(password);
            await userInput.fill(email);

            phase = 'signin';
            await loginButton.click();

            await page.waitForFunction(() => {
              const body = document.body?.innerText || '';
              const session = localStorage.getItem('arisan_session');
              const authReady = window.__awSupabaseAuthReady === true;
              const signedIn = !!session || authReady;
              return signedIn && !/Masuk sebagai Pengelola/i.test(body);
            }, { timeout: 30000 });

            await page.waitForTimeout(1500);

            const afterLogin = await page.evaluate(() => ({
              url: location.href,
              authReady: window.__awSupabaseAuthReady === true,
              hasSession: !!localStorage.getItem('arisan_session'),
              text: (document.body?.innerText || '').slice(0, 1200)
            }));

            if (!afterLogin.authReady && !afterLogin.hasSession) {
              throw new Error('Authenticated session was not established.');
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-dashboard.png`,
              fullPage: true, animations: 'disabled'
            });

            phase = 'dashboard-contract';
            const dashboardState = await page.evaluate(() => {
              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return !el.hidden && r.width > 0 && r.height > 0 &&
                  s.display !== 'none' && s.visibility !== 'hidden';
              };
              const dash = document.querySelector('#root main[data-aw-page="dashboard"]');
              const visiblePages = [...document.querySelectorAll('#root main[data-aw-page]')]
                .filter(visible)
                .map(el => el.getAttribute('data-aw-page'));
              const buttons = [...(dash?.querySelectorAll('button') || [])]
                .map(b => (b.textContent || '').replace(/\s+/g, ' ').trim());
              const quickLabels = ['Tambah Anggota', 'Catat Iuran', 'Kocok Arisan', 'Bagikan Link'];
              const quick = quickLabels.map(label => ({
                label,
                found: buttons.includes(label),
                visible: [...(dash?.querySelectorAll('button') || [])]
                  .filter(b => (b.textContent || '').replace(/\s+/g, ' ').trim() === label)
                  .some(visible)
              }));
              const chart = dash?.querySelector('.flex.items-end.gap-2.h-\\[160px\\]');
              const text = dash?.innerText || '';
              return {
                dashboardVisible: visible(dash),
                visiblePages,
                quick,
                chartVisible: visible(chart),
                hasRecentPayments: /Iuran Terbaru/i.test(text),
                hasWinnerHistory: /Riwayat Pemenang - Dashboard/i.test(text),
                hasUnpaidPanel: /Yang Belum Bayar/i.test(text),
                visibleNaN: /\\bNaN\\b|Rp\\s*NaN/i.test(text),
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
              };
            });
            if (!dashboardState.dashboardVisible ||
                JSON.stringify(dashboardState.visiblePages) !== JSON.stringify(['dashboard']) ||
                dashboardState.quick.some(x => !x.found || !x.visible) ||
                !dashboardState.chartVisible ||
                !dashboardState.hasRecentPayments ||
                !dashboardState.hasWinnerHistory ||
                !dashboardState.hasUnpaidPanel ||
                dashboardState.visibleNaN ||
                dashboardState.horizontalOverflow) {
              throw new Error(`${name}: Dashboard contract failed: ${JSON.stringify(dashboardState)}`);
            }

            phase = 'dashboard-payment-quick-action';
            const paymentQuick = await findActionButton(page, 'Catat Iuran');
            await paymentQuick.scrollIntoViewIfNeeded();
            await paymentQuick.click();
            await page.waitForTimeout(500);

            const paymentModalState = await page.evaluate(() => {
              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return !el.hidden && r.width > 0 && r.height > 0 &&
                  s.display !== 'none' && s.visibility !== 'hidden';
              };
              const overlays = [...document.querySelectorAll('.fixed,[role="dialog"],dialog')].filter(visible);
              const overlay = overlays.find(el =>
                /Catat Pembayaran Iuran/i.test(el.innerText || '')
              );
              const panel = overlay ? (
                [...overlay.children].find(visible) ||
                [...overlay.querySelectorAll('div')].find(el =>
                  visible(el) && String(el.className || '').includes('bg-white')
                )
              ) : null;
              if (!overlay) return {visible:false,centered:false,dx:null,dy:null};
              const or=overlay.getBoundingClientRect();
              const pr=panel?.getBoundingClientRect();
              return {
                visible:true,
                centered:!!pr,
                dx:pr?Math.abs((pr.left+pr.width/2)-(or.left+or.width/2)):null,
                dy:pr?Math.abs((pr.top+pr.height/2)-(or.top+or.height/2)):null
              };
            });
            if (!paymentModalState.visible ||
                !paymentModalState.centered ||
                paymentModalState.dx > 32 ||
                paymentModalState.dy > 32) {
              throw new Error(`${name}: Dashboard Quick Action "Catat Iuran" did not open a centered form: ${JSON.stringify(paymentModalState)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            for (const action of ['Kocok Arisan', 'Bagikan Link', 'Lihat Matriks Lengkap']) {
              const button = await findActionButton(page, action);
              await button.scrollIntoViewIfNeeded();
              await button.click();
              await page.waitForTimeout(700);
              const expectedPage = action === 'Kocok Arisan' ? 'undian' : action === 'Bagikan Link' ? 'share' : 'iuran';
              const targetState = await page.evaluate(pageKey => {
                const el = document.querySelector(`#root main[data-aw-page="${pageKey}"]`);
                const r = el?.getBoundingClientRect();
                const s = el ? getComputedStyle(el) : null;
                return {
                  current: el?.getAttribute('data-aw-page') || null,
                  visible: !!el && !!r && r.width > 0 && r.height > 0 &&
                    s.display !== 'none' && s.visibility !== 'hidden' && !el.hidden
                };
              }, expectedPage);
              if (!targetState.visible) {
                throw new Error(`${name}: Dashboard action "${action}" did not navigate to "${expectedPage}": ${JSON.stringify(targetState)}`);
              }
              const dashNav = await findActionButton(page, 'Dashboard').catch(() => null);
              if (!dashNav) throw new Error(`${name}: Dashboard navigation control was not found after "${action}".`);
              await dashNav.click();
              await page.waitForFunction(() => {
                const el = document.querySelector('#root main[data-aw-page="dashboard"]');
                if (!el) return false;
                const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden' && !el.hidden;
              }, { timeout: 5000 });
            }

            phase = 'member-quick-action';
            const addMemberQuick = await findActionButton(page, 'Tambah Anggota');
            await addMemberQuick.scrollIntoViewIfNeeded();
            await addMemberQuick.click();
            await page.waitForTimeout(500);

            const memberFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              return [...document.querySelectorAll('.fixed')].filter(visible).some(overlay => {
                const heading = [...overlay.querySelectorAll('h2,h3,h4')].some(h =>
                  /^Tambah Anggota Baru$|^Edit Anggota$/i.test((h.textContent || '').trim())
                );
                const fields = [...overlay.querySelectorAll('input,select,textarea')].filter(visible);
                return heading && fields.length >= 1;
              });
            });

            if (!memberFormVisible) {
              throw new Error(`${name}: Dashboard Quick Action "Tambah Anggota" did not open the member modal.`);
            }

            const memberModalGeometry = await page.evaluate(() => {
              const visible = el => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return !el.hidden && r.width > 0 && r.height > 0 &&
                  s.display !== 'none' && s.visibility !== 'hidden';
              };
              const overlays = [...document.querySelectorAll('.fixed')].filter(visible);
              const overlay = overlays.find(el =>
                [...el.querySelectorAll('h2,h3,h4')].some(h =>
                  /^Tambah Anggota Baru$|^Edit Anggota$/i.test((h.textContent || '').trim())
                )
              );
              const panel = overlay ? [...overlay.children].find(visible) : null;
              if (!overlay || !panel) return {ok:false};
              const or = overlay.getBoundingClientRect();
              const pr = panel.getBoundingClientRect();
              return {
                ok:true,
                dx:Math.abs((pr.left+pr.width/2)-(or.left+or.width/2)),
                dy:Math.abs((pr.top+pr.height/2)-(or.top+or.height/2))
              };
            });
            if (!memberModalGeometry.ok ||
                memberModalGeometry.dx > 32 ||
                memberModalGeometry.dy > 32) {
              throw new Error(`${name}: Tambah Anggota modal is not centered: ${JSON.stringify(memberModalGeometry)}`);
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'navigation';

            for (const tab of ['Anggota', 'Iuran', 'Undian', 'Laporan']) {
              await clickNav(page, tab);
              await page.waitForTimeout(700);
              const text = await page.locator('body').innerText();
              if (!new RegExp(tab, 'i').test(text)) {
                throw new Error(`${name}: tab "${tab}" did not render expected content.`);
              }
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const session = localStorage.getItem('arisan_session');
              return !!session || window.__awSupabaseAuthReady === true;
            }, { timeout: 30000 });
            await page.waitForTimeout(1000);

            phase = 'payment-form';
            await clickNav(page, 'Iuran');
            await page.waitForTimeout(700);

            const addPayment = await findActionButton(page, 'Catat Iuran');
            await addPayment.scrollIntoViewIfNeeded();
            await addPayment.click();
            await page.waitForTimeout(400);

            const paymentFormVisible = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' &&
                  s.visibility !== 'hidden' && !el.hidden;
              };
              const forms = [...document.querySelectorAll('form,[role="dialog"],dialog,.fixed')].filter(visible);
              return forms.some(form => {
                const text = form.innerText || '';
                const fields = [...form.querySelectorAll('input,select,textarea')].filter(visible);
                const fieldText = fields.map(x =>
                  (x.placeholder || '') + ' ' + (x.getAttribute('aria-label') || '') + ' ' + (x.name || '')
                ).join(' ');
                return fields.length > 0 && /nominal|anggota|periode|tanggal|bayar/i.test(text + ' ' + fieldText);
              });
            });

            if (!paymentFormVisible) {
              throw new Error(`${name}: Catat Iuran did not open a visible form.`);
            }

            const finalState = await page.evaluate(() => ({
              sessionEmail: (() => {
                try {
                  return JSON.parse(localStorage.getItem('arisan_session') || '{}').email || null;
                } catch {
                  return null;
                }
              })(),
              authReady: window.__awSupabaseAuthReady === true,
              viewport: { width: innerWidth, height: innerHeight },
              horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              visibleNaN: /\\bNaN\\b|Rp\\s*NaN/i.test(document.body?.innerText || '')
            }));

            if (finalState.visibleNaN) {
              throw new Error(`${name}: authenticated UI contains visible NaN.`);
            }
            if (finalState.horizontalOverflow) {
              throw new Error(`${name}: authenticated UI has horizontal overflow.`);
            }

            await page.screenshot({
              path: `test-results/${name}-authenticated-iuran-form.png`,
              fullPage: true, animations: 'disabled'
            });

            summary.push({
              viewport: name,
              authenticated: true,
              authReady: finalState.authReady,
              sessionPresent: !!finalState.sessionEmail,
              checkedTabs: ['Anggota', 'Iuran', 'Undian', 'Laporan'],
              tambahAnggotaFormVisible: memberFormVisible,
              catatIuranFormVisible: paymentFormVisible,
              horizontalOverflow: finalState.horizontalOverflow,
              visibleNaN: finalState.visibleNaN
            });

            await context.close();
            await browser.close();
          }

          (async () => {
            try {
              await inspectViewport('desktop', { width: 1440, height: 1000 });
              await inspectViewport('mobile', { width: 390, height: 844 });

              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));

              if (errors.length) {
                throw new Error('Authenticated E2E produced browser errors: ' + JSON.stringify(errors));
              }

              console.log(JSON.stringify({ summary }, null, 2));
              console.log('Authenticated admin E2E completed without financial mutations.');
            } catch (error) {
              fs.writeFileSync('test-results/browser-errors.json', JSON.stringify(errors, null, 2));
              fs.writeFileSync('test-results/test-summary.json', JSON.stringify(summary, null, 2));
              throw error;
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node auth-e2e.cjs

      - name: Upload authenticated E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arisanpro-auth-e2e-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
