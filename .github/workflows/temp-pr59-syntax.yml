name: TEMP Syntax Check PR59
on:
  push:
    branches:
      - fix/laporan-transaction-panels-toggle-v1
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Parse index.html JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          console.log('script blocks:',scripts.length);
          for(let i=0;i<scripts.length;i++){
            try{ new Function(scripts[i]); console.log('script',i,'PASS'); }
            catch(e){ console.error('script',i,'FAIL:',e.message); console.error(e.stack); process.exit(1); }
          }
          NODE
